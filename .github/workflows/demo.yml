name: Demo

# Builds the frontend in demo mode (VITE_DEMO=1, no backend) and publishes it
# to GitHub Pages, so anyone can try the UI without installing anything.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
#
# The demo has no server: every action a visitor takes is answered in-browser
# and stored in their own localStorage. Nothing is uploaded anywhere.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

# Allow one deploy at a time; newer pushes supersede queued ones.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build demo
        working-directory: web
        # VITE_BASE matches the Pages subpath (https://<owner>.github.io/<repo>/).
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - name: Add SPA + Jekyll fallbacks
        working-directory: web/dist
        # .nojekyll stops Pages from stripping files; 404.html makes an unknown
        # path load the app rather than GitHub's error page (the app itself uses
        # hash routing, so this is only a safety net).
        run: |
          touch .nojekyll
          cp index.html 404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
